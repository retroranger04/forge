run_id: run_01
run_started_at: null

model_checkpoint: outputs/run_01/checkpoints/final.pt

calibration:
  # id_test indices [0, excluded_head_size) were run_01's training validation
  # subset (validation loss only: no gradient, no model selection). They are
  # excluded from calibration and from ID coverage so neither reuses them.
  excluded_head_size: 100

  # Held-out subset of id_test used for calibration: indices
  # [excluded_head_size, excluded_head_size + calibration_split_size).
  # Every id_test sample after that is used for ID coverage measurement.
  calibration_split_size: 500

  # Nominal coverage levels to calibrate to.
  nominal_levels: [0.80, 0.90, 0.95]

  # Nonconformity score: absolute residual of sample mean vs ground truth.
  score: sample_mean_absolute_residual

sampling:
  num_samples_per_condition: 500
  num_fm_steps: 20
  # Inference-only chunking of trajectories; does not affect M, FM steps or the
  # model. Measured on the RTX 4060 Laptop: 94.0 traj/s at 32, 200.5 at 128,
  # 185.8 at 512.
  batch_size: 128

data:
  train_stats_path: data/train_stats.json
  id_test_dir: data/id_test
  ood_fidelity_dir: data/ood_fidelity
  ood_geometry_dir: data/ood_geometry

paths:
  eval_log_path: outputs/run_01/eval.log
  results_path: outputs/run_01/coverage_results.json
